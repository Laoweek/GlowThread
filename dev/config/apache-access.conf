# Dev only. The project root is mounted inside Apache's web root at extensions/GlowThread, so
# everything in it (dev/.env.local, local working folders, docs, tests, hidden folders) would be served.
# Serve only static assets of the extension, outside the folders below, and no hidden file or
# folder of any extension or skin (the fetched ones carry .git folders).
<LocationMatch "^/extensions/GlowThread/">
	Require all denied
</LocationMatch>
<LocationMatch "(?i)^/extensions/GlowThread/(?!(?:client|dev|docs|maintenance|private|scripts|sql|tests|node_modules|vendor)/)(?:[^./][^/]*/)*[^./][^/]*\.(?:css|js|mjs|map|png|gif|jpe?g|svg|webp|ico|woff2?|ttf|otf)$">
	Require all granted
</LocationMatch>
<LocationMatch "^/(?:extensions|skins)/(?:.*/)?\.">
	Require all denied
</LocationMatch>
# A PHP file followed by more path ("Foo.php/x.js") would still run, through PATH_INFO.
<LocationMatch "(?i)^/extensions/GlowThread/.*\.ph(p|ar|tml)">
	Require all denied
</LocationMatch>
