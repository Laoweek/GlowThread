; Dev PHP settings, loaded after the image's own (opcache-recommended.ini).
; Revalidate PHP files on every request, so edits in the mounted extension apply at once.
opcache.revalidate_freq=0
opcache.validate_timestamps=1
opcache.max_accelerated_files=10000
memory_limit=512M
; Errors go to the log files (LocalSettings.dev.php sets error_log), never into responses.
display_errors=Off
log_errors=On
